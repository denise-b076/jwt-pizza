name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza_e2e
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: denise-b076/jwt-pizza-service
          path: jwt-pizza-service

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Build
        run: |
          npm ci && npm run build
          cp dist/index.html dist/404.html

      - name: Start backend
        working-directory: jwt-pizza-service
        run: |
          npm ci
          cat > src/config.js <<'EOF'
          module.exports = {
            jwtSecret: 'frontend-e2e-test-secret',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza_e2e',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: '',
            },
          };
          EOF
          npm start > "$RUNNER_TEMP/jwt-pizza-service.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jwt-pizza-service.pid"
          curl --fail --retry 20 --retry-delay 1 http://localhost:3000/api/docs

      - name: Seed backend test data
        run: |
          curl --fail --retry 5 --retry-delay 1 \
            -X POST http://localhost:3000/api/auth \
            -H 'Content-Type: application/json' \
            -d '{"name":"pizza franchisee","email":"f@jwt.com","password":"franchisee"}'

          admin_token=$(curl --fail -sS \
            -X PUT http://localhost:3000/api/auth \
            -H 'Content-Type: application/json' \
            -d '{"email":"a@jwt.com","password":"admin"}' | jq -r '.token')

          test "$admin_token" != "null"
          curl --fail -sS \
            -X POST http://localhost:3000/api/franchise \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $admin_token" \
            -d '{"name":"pizzaPocket","admins":[{"email":"f@jwt.com"}]}'

      - name: Update pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Run tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:coverage

      - name: Update coverage
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
          curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzacoverage?label=Coverage&value=$coverage%25&color=$color" -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
